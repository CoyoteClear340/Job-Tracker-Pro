openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Job & Internship Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: Job application operations
  - name: gmail
    description: Gmail sync operations
  - name: alerts
    description: Job alert operations
  - name: scam
    description: Scam detection rule operations
  - name: notifications
    description: In-app notification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all job applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [applied, interview, offer, rejected, ghosted]
        - name: search
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create a new job application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/stats:
    get:
      operationId: getApplicationStats
      tags: [applications]
      summary: Get application statistics by status
      responses:
        "200":
          description: Application stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStats"

  /applications/recent:
    get:
      operationId: getRecentActivity
      tags: [applications]
      summary: Get recent application activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"

  /applications/bulk:
    post:
      operationId: bulkUpdateApplications
      tags: [applications]
      summary: Bulk update, mark scam, or delete applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionBody"
      responses:
        "200":
          description: Bulk action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get aggregated analytics data for charts
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

  /applications/needs-attention:
    get:
      operationId: getNeedsAttention
      tags: [applications]
      summary: Get applications that need follow-up (stale status)
      parameters:
        - name: staleDays
          in: query
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Applications needing follow-up
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeedsAttentionItem"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get a single application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /applications/{id}/notes:
    post:
      operationId: addApplicationNote
      tags: [applications]
      summary: Add a note to an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddNoteBody"
      responses:
        "200":
          description: Updated application with note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /gmail/sync:
    post:
      operationId: triggerGmailSync
      tags: [gmail]
      summary: Trigger Gmail sync to detect new application emails
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncResult"

  /gmail/status:
    get:
      operationId: getGmailSyncStatus
      tags: [gmail]
      summary: Get Gmail sync connection status
      responses:
        "200":
          description: Gmail sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncStatus"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List job alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobAlert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a job alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertBody"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAlert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete a job alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppNotification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppNotification"

  /notifications/clear:
    delete:
      operationId: clearNotifications
      tags: [notifications]
      summary: Clear all read notifications
      responses:
        "204":
          description: Cleared

  /notifications/send-test-email:
    post:
      operationId: sendTestEmail
      tags: [notifications]
      summary: Send a test email to verify SMTP config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTestEmailBody"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message

  /notifications/email-config:
    get:
      operationId: getEmailConfig
      tags: [notifications]
      summary: Get current email configuration status
      responses:
        "200":
          description: Email config status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConfigStatus"

  /scam-rules:
    get:
      operationId: listScamRules
      tags: [scam]
      summary: List all scam detection rules
      responses:
        "200":
          description: List of scam rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScamRule"
    post:
      operationId: createScamRule
      tags: [scam]
      summary: Create a custom scam detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScamRuleBody"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamRule"

  /scam-rules/{id}:
    patch:
      operationId: updateScamRule
      tags: [scam]
      summary: Toggle a scam rule active/inactive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScamRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScamRule"
    delete:
      operationId: deleteScamRule
      tags: [scam]
      summary: Delete a custom scam rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scam-rules/scan:
    post:
      operationId: scanApplications
      tags: [scam]
      summary: Re-scan all applications against current rules
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /applications/{id}/mark-safe:
    post:
      operationId: markApplicationSafe
      tags: [applications]
      summary: Mark a flagged application as safe (not a scam)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}/mark-scam:
    post:
      operationId: markApplicationScam
      tags: [applications]
      summary: Mark an application as a confirmed scam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkScamBody"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Application:
      type: object
      properties:
        id:
          type: integer
        company:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [applied, interview, offer, rejected, ghosted]
        source:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        appliedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        isScam:
          type: boolean
        scamReason:
          type: string
          nullable: true
        emailMessageId:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
      required:
        - id
        - company
        - role
        - status
        - appliedAt
        - updatedAt
        - isScam

    BulkActionBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        action:
          type: string
          enum: [updateStatus, markScam, delete]
        status:
          type: string
          enum: [applied, interview, offer, rejected, ghosted]
          nullable: true
      required: [ids, action]

    BulkActionResult:
      type: object
      properties:
        affected:
          type: integer
        action:
          type: string
      required: [affected, action]

    MonthBucket:
      type: object
      properties:
        month:
          type: string
        applied:
          type: integer
        interview:
          type: integer
        offer:
          type: integer
        rejected:
          type: integer
        ghosted:
          type: integer
        total:
          type: integer
      required: [month, applied, interview, offer, rejected, ghosted, total]

    SourceBucket:
      type: object
      properties:
        source:
          type: string
        count:
          type: integer
        responseCount:
          type: integer
      required: [source, count, responseCount]

    AnalyticsData:
      type: object
      properties:
        byMonth:
          type: array
          items:
            $ref: "#/components/schemas/MonthBucket"
        bySource:
          type: array
          items:
            $ref: "#/components/schemas/SourceBucket"
        statusTotals:
          type: object
          properties:
            applied:
              type: integer
            interview:
              type: integer
            offer:
              type: integer
            rejected:
              type: integer
            ghosted:
              type: integer
          required: [applied, interview, offer, rejected, ghosted]
        totalApplications:
          type: integer
        overallResponseRate:
          type: number
      required: [byMonth, bySource, statusTotals, totalApplications, overallResponseRate]

    NeedsAttentionItem:
      type: object
      properties:
        id:
          type: integer
        company:
          type: string
        role:
          type: string
        status:
          type: string
        location:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        appliedAt:
          type: string
          format: date-time
        daysSinceUpdate:
          type: integer
        isScam:
          type: boolean
      required:
        - id
        - company
        - role
        - status
        - updatedAt
        - appliedAt
        - daysSinceUpdate
        - isScam

    CreateApplicationBody:
      type: object
      properties:
        company:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [applied, interview, offer, rejected, ghosted]
          default: applied
        source:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        appliedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - company
        - role

    UpdateApplicationBody:
      type: object
      properties:
        company:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [applied, interview, offer, rejected, ghosted]
        source:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        isScam:
          type: boolean
        scamReason:
          type: string
          nullable: true

    AddNoteBody:
      type: object
      properties:
        notes:
          type: string
      required:
        - notes

    ApplicationStats:
      type: object
      properties:
        total:
          type: integer
        applied:
          type: integer
        interview:
          type: integer
        offer:
          type: integer
        rejected:
          type: integer
        ghosted:
          type: integer
        responseRate:
          type: number
        thisWeek:
          type: integer
        thisMonth:
          type: integer
      required:
        - total
        - applied
        - interview
        - offer
        - rejected
        - ghosted
        - responseRate
        - thisWeek
        - thisMonth

    GmailSyncResult:
      type: object
      properties:
        synced:
          type: integer
        newApplications:
          type: integer
        updatedApplications:
          type: integer
        flaggedScams:
          type: integer
        connected:
          type: boolean
        message:
          type: string
      required:
        - synced
        - newApplications
        - updatedApplications
        - flaggedScams
        - connected
        - message

    GmailSyncStatus:
      type: object
      properties:
        connected:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        totalEmailsProcessed:
          type: integer
      required:
        - connected
        - totalEmailsProcessed

    JobAlert:
      type: object
      properties:
        id:
          type: integer
        keyword:
          type: string
        company:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - keyword
        - active
        - createdAt

    CreateAlertBody:
      type: object
      properties:
        keyword:
          type: string
        company:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
      required:
        - keyword

    ScamRule:
      type: object
      properties:
        id:
          type: integer
        pattern:
          type: string
        description:
          type: string
        ruleType:
          type: string
          enum: [builtin, custom]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - pattern
        - description
        - ruleType
        - active
        - createdAt

    CreateScamRuleBody:
      type: object
      properties:
        pattern:
          type: string
        description:
          type: string
      required:
        - pattern
        - description

    UpdateScamRuleBody:
      type: object
      properties:
        active:
          type: boolean
        description:
          type: string

    ScanResult:
      type: object
      properties:
        scanned:
          type: integer
        flagged:
          type: integer
        cleared:
          type: integer
        message:
          type: string
      required:
        - scanned
        - flagged
        - cleared
        - message

    AppNotification:
      type: object
      properties:
        id:
          type: integer
        alertId:
          type: integer
          nullable: true
        applicationId:
          type: integer
          nullable: true
        message:
          type: string
        read:
          type: boolean
        emailSent:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - message
        - read
        - emailSent
        - createdAt

    SendTestEmailBody:
      type: object
      properties:
        to:
          type: string
          format: email
      required:
        - to

    EmailConfigStatus:
      type: object
      properties:
        configured:
          type: boolean
        notifyEmail:
          type: string
          nullable: true
        smtpHost:
          type: string
          nullable: true
      required:
        - configured

    MarkScamBody:
      type: object
      properties:
        reason:
          type: string
          nullable: true
